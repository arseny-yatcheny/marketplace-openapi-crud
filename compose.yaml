services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-marketplace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U marketplace -d marketplace']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: redgate/flyway:11.13.2-alpine
    depends_on:
      db:
        condition: service_healthy
    command: -connectRetries=30 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/marketplace
      FLYWAY_USER: marketplace
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-marketplace}
    volumes:
      - ./migrations:/flyway/sql:ro
  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://marketplace:${POSTGRES_PASSWORD:-local-marketplace}@db:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:?Run make setup first}
      ORDER_INTERVAL_MINUTES: ${ORDER_INTERVAL_MINUTES:-1}
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
