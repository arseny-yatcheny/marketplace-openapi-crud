      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    Role:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    ProductCreate:
      type: object
      additionalProperties: false
      required: &id005
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        stock:
          type: integer
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductUpdate:
      type: object
      additionalProperties: false
      required: *id005
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        stock:
          type: integer
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - price
      - stock
      - category
      - status
      - seller_id
      - id
      - created_at
      - updated_at
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        stock:
          type: integer
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
        id: *id001
        created_at: &id006
          type: string
          format: date-time
        updated_at: *id006
    ProductPage:
      type: object
      additionalProperties: false
      required:
