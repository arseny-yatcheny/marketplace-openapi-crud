          maxLength: 100
          pattern: ^[a-zA-Z0-9_.-]+$
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          writeOnly: true
        role:
          type: string
          enum:
          - USER
          - SELLER
          default: USER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          writeOnly: true
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    UserResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - role
      properties:
        id: *id001
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    TokenPair:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          example: 1200
