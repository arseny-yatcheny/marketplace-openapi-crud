      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      - active
      - id
      - current_uses
      properties:
        code: *id008
        discount_type: *id009
        discount_value: *id010
        min_order_amount: *id011
        max_uses: *id012
        valid_from: *id006
        valid_until: *id006
        active: *id013
        id: *id001
        current_uses:
          type: integer
          minimum: 0
