          - PRODUCT_INACTIVE
          - ORDER_NOT_FOUND
          - ORDER_LIMIT_EXCEEDED
          - ORDER_HAS_ACTIVE
          - INVALID_STATE_TRANSITION
          - INSUFFICIENT_STOCK
          - PROMO_CODE_INVALID
          - PROMO_CODE_MIN_AMOUNT
          - ORDER_OWNERSHIP_VIOLATION
          - VALIDATION_ERROR
          - TOKEN_EXPIRED
          - TOKEN_INVALID
          - REFRESH_TOKEN_INVALID
          - ACCESS_DENIED
          - USERNAME_TAKEN
          - PROMO_CODE_EXISTS
          - INVALID_CREDENTIALS
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - INTERNAL_ERROR
        message:
          type: string
