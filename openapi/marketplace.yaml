openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: 'Учебный маркетплейс. Цена передаётся JSON-числом с точностью до копеек.
    Все операции, кроме /auth/*, требуют access JWT. Неверные входные данные возвращают
    400. Повторные product_id в заказе запрещены. Скидка PERCENTAGE свыше 70% не применяется:
    оплачивается 100% цены. При обновлении сохранённые позиции сохраняют исходную
    цену; новые получают текущую. При отмене резерв и использование промокода возвращаются
    один раз.'
servers:
- url: http://localhost:8000
security:
- BearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      summary: Регистрация USER или SELLER
      description: Регистрация USER или SELLER. ADMIN создаётся только через CLI
      tags:
      - auth
      responses:
        '201':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: &id001
                type: string
                format: uuid
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: USERNAME_TAKEN
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      operationId: login
      summary: Вход
      description: Вход. Access JWT действует 20 минут, refresh JWT — 14 дней
      tags:
      - auth
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: INVALID_CREDENTIALS
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Обновление пары токенов
      description: 'Обновление пары токенов. Refresh одноразовый: предыдущий отзывается
        атомарно'
      tags:
      - auth
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: REFRESH_TOKEN_INVALID
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /products:
    post:
      operationId: create_product
      summary: Создание товара
      description: 'Создание товара. seller_id автоматически заполняется ID текущего
        пользователя. Роли: SELLER, ADMIN.'
      tags:
      - products
      responses:
        '201':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: ACCESS_DENIED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: &id003
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
    get:
      operationId: list_products
      summary: Список всех товаров, включая ARCHIVED
      description: 'Список всех товаров, включая ARCHIVED. Фильтры status и category
        применяются совместно, category сравнивается точно. Порядок created_at, id
        Роли: USER, SELLER, ADMIN.'
      tags:
      - products
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: ACCESS_DENIED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: &id002
      - USER
      - SELLER
      - ADMIN
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: category
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
  /products/{id}:
    get:
      operationId: get_product
      summary: Получение любого товара
      description: 'Получение любого товара Роли: USER, SELLER, ADMIN.'
      tags:
      - products
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: ACCESS_DENIED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: PRODUCT_NOT_FOUND
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: *id002
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
    put:
      operationId: update_product
      summary: Полная замена полей товара
      description: 'Полное обновление полей товара. SELLER обновляет только свой товар,
        ADMIN — любой. Владелец товара сохраняется. Роли: SELLER, ADMIN.'
      tags:
      - products
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: ACCESS_DENIED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: PRODUCT_NOT_FOUND
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: *id003
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
    delete:
      operationId: delete_product
      summary: Мягкое удаление товара в ARCHIVED
      description: 'Мягкое удаление товара в ARCHIVED. SELLER удаляет только свой
        товар. Повторное удаление возвращает 204 Роли: SELLER, ADMIN.'
      tags:
      - products
      responses:
        '204':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: ACCESS_DENIED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: PRODUCT_NOT_FOUND
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: *id003
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /orders:
    post:
      operationId: create_order
      summary: Создание собственного заказа и резервирование в одной транзакции
      description: 'Создание собственного заказа и резервирование в одной транзакции.
        Проверки: лимит, активный заказ, каталог, остатки, промокод Роли: USER, ADMIN.'
      tags:
      - orders
      responses:
        '201':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: ACCESS_DENIED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: ORDER_LIMIT_EXCEEDED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ORDER_HAS_ACTIVE, PRODUCT_INACTIVE, INSUFFICIENT_STOCK
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: PRODUCT_NOT_FOUND
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: &id004
      - USER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
  /orders/{id}:
    get:
      operationId: get_order
      summary: Получение заказа
      description: 'Получение заказа. USER видит только свой, ADMIN — любой Роли:
        USER, ADMIN.'
      tags:
      - orders
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ORDER_NOT_FOUND
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: *id004
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
    put:
      operationId: update_order
      summary: Замена позиций только в CREATED
      description: 'Замена позиций только в CREATED. USER обновляет свой заказ, ADMIN
        — любой. Лимит относится к автору запроса. Порог промокода проверяется заново;
        при недостаточной сумме промокод снимается. Уже занятое заказом использование
        учитывается при проверке max_uses. Истёкший или выключенный промокод даёт
        422 и откат Роли: USER, ADMIN.'
      tags:
      - orders
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          description: METHOD_NOT_ALLOWED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ORDER_NOT_FOUND, PRODUCT_NOT_FOUND
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: INVALID_STATE_TRANSITION, PRODUCT_INACTIVE, INSUFFICIENT_STOCK
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: ORDER_LIMIT_EXCEEDED
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: PROMO_CODE_INVALID
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-roles: *id004
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
  /orders/{id}/cancel:
    post:
      operationId: cancel_order
      summary: Отмена из CREATED или PAYMENT_PENDING
      description: 'Отмена из CREATED или PAYMENT_PENDING. USER отменяет свой заказ,
        ADMIN — любой. Остатки и использование промокода возвращаются атомарно Роли:
        USER, ADMIN.'
      tags:
      - orders
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-Request-Id:
              schema: *id001
              description: UUID запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: VALIDATION_ERROR
          headers:
            X-Request-Id:
              schema: *id001
          content:
            application/json:
